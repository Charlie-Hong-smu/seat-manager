<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权运营后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M20 32h24M32 20v24' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=20260713-2">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>授权运营后台</h1>
      <span class="muted">授权、渠道、到期、AI 与设备运营</span>
    </div>
    <div class="button-row">
      <button class="button ghost" type="button" id="refreshBtn">刷新数据</button>
      <button class="button" type="button" id="newLicenseBtn">新建授权</button>
    </div>
  </header>

  <main class="page">
    <details class="panel settings">
      <summary><span>连接设置</span><span class="muted">管理员密钥只保存在当前浏览器</span></summary>
      <form class="settings-body" id="connectionForm">
        <label class="field">Worker 地址<input id="workerUrl" autocomplete="off" value="https://seat-manager-ai.hongchenglin03.workers.dev"></label>
        <label class="field">管理员密钥<input id="adminToken" type="password" autocomplete="current-password" placeholder="输入后可记住"></label>
        <div class="button-row">
          <button class="button secondary" type="button" id="saveTokenBtn">记住密钥</button>
          <button class="button ghost" type="button" id="forgetTokenBtn">清除</button>
        </div>
      </form>
    </details>

    <section class="metrics" aria-label="授权运营概览">
      <button class="metric" type="button" data-metric-filter="all"><span class="metric-label">授权总数</span><strong class="metric-value" id="metricTotal">—</strong><span class="metric-note">全部授权记录</span></button>
      <button class="metric" type="button" data-metric-filter="usable"><span class="metric-label">当前可用</span><strong class="metric-value" id="metricUsable">—</strong><span class="metric-note">启用且未到期</span></button>
      <button class="metric" type="button" data-metric-filter="expiring"><span class="metric-label">30 天内到期</span><strong class="metric-value" id="metricExpiring">—</strong><span class="metric-note">需要续期关注</span></button>
      <button class="metric" type="button" data-metric-filter="ai"><span class="metric-label">有效 AI 授权</span><strong class="metric-value" id="metricAi">—</strong><span class="metric-note">已开通且未到期</span></button>
      <button class="metric" type="button" data-metric-filter="devices"><span class="metric-label">设备占用</span><strong class="metric-value" id="metricDevices">—</strong><span class="metric-note">已绑定 / 总额度</span></button>
    </section>

    <section class="insights">
      <article class="panel">
        <div class="panel-header"><div><h2>获客渠道分布</h2><div class="muted">点击渠道筛选授权列表</div></div></div>
        <div class="insight-body" id="channelChart"><div class="muted">刷新后显示渠道分布。</div></div>
      </article>
      <article class="panel">
        <div class="panel-header"><div><h2>到期风险分布</h2><div class="muted">按当前时间实时计算</div></div></div>
        <div class="insight-body" id="expiryChart"><div class="muted">刷新后显示到期分布。</div></div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div><h2>授权记录</h2><div class="muted" id="summaryText">尚未加载</div></div>
        <div class="status" id="pageStatus" role="status"></div>
      </div>
      <div class="filters">
        <label class="field search">搜索<input id="searchInput" type="search" placeholder="授权代号、授权码或来源明细"></label>
        <label class="field">有效状态<select id="statusFilter"><option value="all">全部</option><option value="usable">当前可用</option><option value="expiring">30 天内到期</option><option value="expired">已到期</option><option value="disabled">已停用</option></select></label>
        <label class="field">获客渠道<select id="channelFilter"><option value="all">全部渠道</option></select></label>
        <label class="field">可登录版本<select id="editionFilter"><option value="all">全部版本</option><option value="commercial">商用版</option><option value="zhang">小张版</option></select></label>
        <label class="field">AI 权益<select id="aiFilter"><option value="all">全部</option><option value="valid">当前有效</option><option value="disabled">未开通</option></select></label>
        <label class="field">设备占用<select id="deviceFilter"><option value="all">全部</option><option value="none">未绑定</option><option value="used">已绑定</option><option value="full">额度已满</option></select></label>
        <label class="field">排序<select id="sortFilter"><option value="created-desc">最新创建</option><option value="expiry-asc">最早到期</option><option value="license-asc">授权代号</option><option value="devices-desc">设备占用</option></select></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>授权</th><th>状态</th><th>渠道</th><th>版本</th><th>软件到期</th><th>AI 权益</th><th>设备</th><th>操作</th></tr></thead>
          <tbody id="licenseRows"><tr><td colspan="8" class="empty">输入管理员密钥并刷新数据。</td></tr></tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="muted" id="pageInfo">第 1 / 1 页</span>
        <div class="button-row"><button class="button ghost small" type="button" id="prevPageBtn">上一页</button><button class="button ghost small" type="button" id="nextPageBtn">下一页</button></div>
      </div>
    </section>
  </main>

  <div class="overlay" id="editorOverlay" aria-hidden="true" inert hidden>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <form id="licenseForm">
        <div class="drawer-header"><div><h2 id="editorTitle">新建授权</h2><div class="muted" id="editorSubtitle">填写授权与渠道信息</div></div><button class="button ghost small" type="button" id="closeEditorBtn" aria-label="关闭编辑面板">关闭</button></div>
        <div class="form-grid">
          <input id="licenseKey" type="hidden">
          <label class="field">老师/客户代号<input id="licenseId" autocomplete="off" placeholder="例如 xhs-123456-20260713" required></label>
          <label class="field">授权码<input id="productCode" autocomplete="off" placeholder="新建时填写或自动生成"></label>
          <div class="button-row wide"><button class="button secondary small" type="button" id="generateCodeBtn">生成新授权码</button><button class="button ghost small" type="button" id="copyCodeBtn">复制授权码</button></div>
          <div class="code-box wide" id="newCodeBox" hidden></div>
          <label class="field">获客渠道<select id="acquisitionChannel" required><option value="">请选择渠道</option></select></label>
          <label class="field">来源明细<input id="acquisitionDetail" maxlength="120" placeholder="账号、活动或转介绍人；其他渠道必填"></label>
          <label class="field">软件状态<select id="status"><option value="active">可用</option><option value="disabled">停用</option></select></label>
          <label class="field">可登录版本<select id="allowedEditions"><option value="commercial">仅商用版</option><option value="zhang">仅小张版</option><option value="zhang,commercial">小张版和商用版</option></select></label>
          <label class="field">最多设备数<input id="maxDevices" type="number" min="1" max="10" value="3"></label>
          <div></div>
          <label class="field">软件到期日<input id="expiresAt" type="date"></label>
          <label class="field">AI 到期日<input id="aiExpiresAt" type="date"></label>
          <label class="checkline"><input id="aiEnabled" type="checkbox" checked>开通 AI</label>
          <label class="field">AI 每日次数<input id="aiDailyLimit" type="number" min="1" max="500" value="30"></label>
          <label class="checkline wide"><input id="clearDevices" type="checkbox">保存时清空已绑定设备</label>
          <div class="status wide" id="formStatus" role="status"></div>
        </div>
        <div class="drawer-footer"><button class="button ghost" type="button" id="resetFormBtn">重置</button><div class="button-row"><button class="button ghost" type="button" id="cancelEditorBtn">取消</button><button class="button" type="submit" id="saveLicenseBtn">保存授权</button></div></div>
      </form>
    </section>
  </div>

  <div class="overlay" id="confirmOverlay" aria-hidden="true" inert hidden>
    <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">确认操作</h2><p id="confirmMessage"></p>
      <div class="button-row"><button class="button ghost" type="button" id="confirmCancelBtn">取消</button><button class="button danger" type="button" id="confirmActionBtn">确认</button></div>
    </section>
  </div>

  <script type="module" src="./app.js?v=20260713-2"></script>
</body>
</html>
