name: Deploy React frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend-react/src/**"
      - "shared/**"
      - "frontend-react/public/**"
      - "frontend-react/e2e/**"
      - "frontend-react/scripts/**"
      - "frontend-react/package.json"
      - "frontend-react/pnpm-lock.yaml"
      - "frontend-react/vite.config.ts"
      - "frontend-react/playwright*.config.ts"
      - "frontend-react/tsconfig*.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/promote-commercial.yml"
      - ".github/scripts/verify-zhang-release*.mjs"
  workflow_dispatch:
    inputs:
      sync_auto_release:
        description: "生成自动同步入口开启的 Zhang 正式产物；须另有唯一空间许可及逐设备同意"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: frontend-react/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

      - name: Install Worker test runtime
        working-directory: cloudflare-worker
        run: npm ci

      - name: Validate React frontend
        # Snapshot state-machine tests use the same pinned workerd/SQLite runtime as the backend.
        working-directory: frontend-react
        run: pnpm run check:design && pnpm run lint && pnpm run typecheck && pnpm run test:coverage

      # This marker is reusable only with every required check and Zhang deploy
      # successful in the same attempt. Bump the contract when gates change.
      - name: Validate release verification contract v3
        run: node --test .github/scripts/verify-zhang-release.test.mjs

  zhang-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: frontend-react/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

      - name: Install Worker browser test runtime
        working-directory: cloudflare-worker
        run: npm ci

      - name: Install Chromium
        working-directory: frontend-react
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Zhang in Chromium
        working-directory: frontend-react
        run: E2E_EDITION=zhang pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Validate enabled Zhang sync in Chromium
        if: matrix.shard == 1
        working-directory: frontend-react
        run: E2E_EDITION=zhang pnpm run test:e2e:sync

      - name: Upload failed Zhang browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zhang-browser-failure-${{ matrix.shard }}
          path: |
            frontend-react/test-results
            frontend-react/.sync-e2e-results
            frontend-react/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # Build the actual release after the isolated enabled-sync checks. A normal
      # push stays closed; only an explicit manual dispatch selects the open build.
      - name: Build Zhang release with automatic sync disabled
        if: matrix.shard == 1 && !(github.event_name == 'workflow_dispatch' && inputs.sync_auto_release)
        working-directory: frontend-react
        env:
          VITE_SYNC_AUTO_RELEASE: "false"
        run: pnpm run build:zhang

      - name: Build Zhang release with automatic sync enabled
        if: matrix.shard == 1 && github.event_name == 'workflow_dispatch' && inputs.sync_auto_release
        working-directory: frontend-react
        env:
          VITE_SYNC_AUTO_RELEASE: "true"
        run: pnpm run build:zhang

      - name: Check Zhang production bundle
        if: matrix.shard == 1
        working-directory: frontend-react
        run: pnpm run check:production

      - name: Check Zhang bundle size
        if: matrix.shard == 1
        working-directory: frontend-react
        run: pnpm run check:size

      - name: Upload Pages artifact
        if: matrix.shard == 1
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-auto-${{ github.event_name == 'workflow_dispatch' && inputs.sync_auto_release && 'on' || 'off' }}-${{ github.run_attempt }}
          path: frontend-react/dist

  commercial-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: frontend-react/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

      - name: Install Worker browser test runtime
        working-directory: cloudflare-worker
        run: npm ci

      - name: Install Chromium
        working-directory: frontend-react
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Commercial in Chromium
        working-directory: frontend-react
        run: pnpm run test:e2e:commercial

      - name: Validate enabled Commercial sync in Chromium
        working-directory: frontend-react
        run: E2E_EDITION=commercial pnpm run test:e2e:sync

      - name: Upload failed Commercial browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-failure
          path: |
            frontend-react/test-results
            frontend-react/.sync-e2e-results
            frontend-react/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, zhang-e2e, commercial-e2e]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-auto-${{ github.event_name == 'workflow_dispatch' && inputs.sync_auto_release && 'on' || 'off' }}-${{ github.run_attempt }}
