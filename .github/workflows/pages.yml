name: Deploy React frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend-react/src/**"
      - "frontend-react/public/**"
      - "frontend-react/e2e/**"
      - "frontend-react/scripts/**"
      - "frontend-react/package.json"
      - "frontend-react/pnpm-lock.yaml"
      - "frontend-react/vite.config.ts"
      - "frontend-react/playwright.config.ts"
      - "frontend-react/tsconfig*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: frontend-react/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-react/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

      - name: Validate React frontend
        working-directory: frontend-react
        run: pnpm run lint && pnpm run typecheck && pnpm run test:coverage

      - name: Install Chromium
        working-directory: frontend-react
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate both editions in Chromium
        working-directory: frontend-react
        run: pnpm run test:e2e:all

      - name: Build React frontend
        working-directory: frontend-react
        run: pnpm run build:zhang && pnpm run check:size

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages
          cp -R frontend-react/dist/. pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
