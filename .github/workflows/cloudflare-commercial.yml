name: Deploy shared Cloudflare services

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - "license-admin/**"
      - ".github/workflows/cloudflare-commercial.yml"
      - "!frontend-react/**/*.md"
      - "!cloudflare-worker/**/*.md"
      - "!license-admin/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-commercial
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_cloudflare_secrets: ${{ steps.secrets.outputs.has_cloudflare_secrets }}
      worker: ${{ steps.filter.outputs.worker }}
      license_admin: ${{ steps.filter.outputs.license_admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 拉全历史,否则 git diff 在多提交 push / force push 时会因浅克隆缺 before 提交而失败。
          fetch-depth: 0

      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "has_cloudflare_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cloudflare_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed targets
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "license_admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          # 首次推送、force push 或浅克隆里取不到 before 提交时,git diff 会失败。
          # 这种情况下无法可靠判断改了哪些目录,直接全部部署,避免 job 整体挂掉。
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "license_admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed-files.txt
          grep -Ev '\.md$' /tmp/changed-files.txt > /tmp/deploy-files.txt || true

          if grep -Eq '^(cloudflare-worker/|\.github/workflows/cloudflare-commercial\.yml$)' /tmp/deploy-files.txt; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(license-admin/|\.github/workflows/cloudflare-commercial\.yml$)' /tmp/deploy-files.txt; then
            echo "license_admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "license_admin=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_cloudflare_secrets == 'true' && needs.changes.outputs.worker == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Validate Worker and proxy contracts
        working-directory: cloudflare-worker
        run: npm run check

      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  deploy-license-admin:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_cloudflare_secrets == 'true' && needs.changes.outputs.license_admin == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        working-directory: cloudflare-worker
        run: npm ci

      - name: Deploy license admin Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cloudflare-worker/node_modules/.bin/wrangler pages deploy license-admin --project-name seat-manager-license-admin --branch main --commit-dirty=true
