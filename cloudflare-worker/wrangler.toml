name = "seat-manager-ai"
main = "worker-entry.js"
compatibility_date = "2026-06-29"
workers_dev = true

[vars]
SYNC_FRESH_INITIALIZATION_ENABLED = "false"
SYNC_FRESH_TEST_GRANTS = "{}"
SYNC_MIGRATION_ENABLED = "false"
SYNC_CUTOVER_MANIFESTS = "{}"
SYNC_AUTOMATIC_ENABLED = "false"
SYNC_AUTOMATIC_SPACES = "[]"
SYNC_COMMERCIAL_PROTOCOL_READY = "false"
ALLOWED_ORIGIN = "https://charlie-hong-smu.github.io,https://seat-manager-commercial.pages.dev,https://6c245938.seat-manager-commercial.pages.dev,https://app.class-manager.cn,https://seat-manager-license-admin.pages.dev,https://bdd1a8db.seat-manager-license-admin.pages.dev"

[[kv_namespaces]]
binding = "SEAT_MANAGER_KV"
id = "c825c37e3d1a43e5928251dab78731c4"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "202607101"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "202607102"

  [ratelimits.simple]
  limit = 12
  period = 60

[[durable_objects.bindings]]
name = "ACCOUNT_COORDINATOR"
class_name = "AccountCoordinator"

[[migrations]]
tag = "v1-account-coordinator"
new_sqlite_classes = ["AccountCoordinator"]

[[durable_objects.bindings]]
name = "SYNC_COORDINATOR"
class_name = "SyncCoordinator"

[[migrations]]
tag = "v2-sync-coordinator"
new_sqlite_classes = ["SyncCoordinator"]

[[ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "202610011"

  [ratelimits.simple]
  limit = 30
  period = 60
